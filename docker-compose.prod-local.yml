name: cloudstore-prod-local

x-server-base: &server-base
  build:
    context: ./server
    dockerfile: Dockerfile
  image: cloudstore-local/server:prod-local
  env_file:
    - .env.prod-local.local
  restart: unless-stopped
  networks:
    - prod-local-net

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cloud_storage}
      POSTGRES_USER: ${POSTGRES_USER:-csp_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - prod-local-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-csp_user} -d ${POSTGRES_DB:-cloud_storage}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-local-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - prod-local-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-local-net

  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    ports:
      - '39000:9000'
      - '39001:9001'
    volumes:
      - prod-local-miniodata:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - prod-local-net

  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD};
      mc mb --ignore-existing local/${MINIO_BUCKET:-cloudstore-prod-local};
      mc anonymous set none local/${MINIO_BUCKET:-cloudstore-prod-local};
      exit 0;
      "
    networks:
      - prod-local-net

  nestjs:
    <<: *server-base
    command: ['npm', 'run', 'start:prod']
    expose:
      - '3000'
    ports:
      - '3200:3000'
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-csp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloud_storage}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:39000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloudstore-prod-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/auth/providers').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  server-worker:
    <<: *server-base
    command: ['node', 'dist/worker.js']
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-csp_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-cloud_storage}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:39000
      MINIO_REGION: ${MINIO_REGION:-us-east-1}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
      MINIO_BUCKET: ${MINIO_BUCKET:-cloudstore-prod-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      nestjs:
        condition: service_healthy

  nextjs:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        BACKEND_URL: http://nestjs:3000
    image: cloudstore-local/client:prod-local
    restart: unless-stopped
    expose:
      - '3001'
    ports:
      - '3101:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
      BACKEND_URL: http://nestjs:3000
      NEXT_TELEMETRY_DISABLED: '1'
    depends_on:
      nestjs:
        condition: service_healthy
    networks:
      - prod-local-net

volumes:
  prod-local-pgdata:
  prod-local-redisdata:
  prod-local-miniodata:

networks:
  prod-local-net:
    driver: bridge
