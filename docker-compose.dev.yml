name: csp

services:
  postgres:
    image: postgres:16-alpine
    container_name: csp-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csp-dev-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: csp-redis-dev
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data
    ports:
      - '6380:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csp-dev-network
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: csp-minio-dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-dev-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csp-dev-network

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: csp-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      mc mb --ignore-existing local/${MINIO_BUCKET:-clouddrive-local};
      mc anonymous set none local/${MINIO_BUCKET:-clouddrive-local};
      exit 0;
      "
    networks:
      - csp-dev-network

  server-worker:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start:worker"
    environment:
      NODE_ENV: development
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      DATABASE_URL: postgresql://csp_user:csp_password_2024@postgres:5432/cloud_storage?schema=public
      STORAGE_DRIVER: minio
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: clouddrive-local
    volumes:
      - ./server:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - csp-dev-network

volumes:
  postgres-dev-data:
  minio-dev-data:
  redis-dev-data:

networks:
  csp-dev-network:
    driver: bridge
