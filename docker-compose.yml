services:
  nginx:
    image: nginx:1.25-alpine
    container_name: csp-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      nextjs:
        condition: service_started
      nestjs:
        condition: service_started
    networks:
      - csp-network
    restart: unless-stopped

  nextjs:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: csp-nextjs
    environment:
      - NEXT_PUBLIC_API_URL=http://nestjs:3000
    networks:
      - csp-network
    restart: unless-stopped

  nestjs:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: csp-nestjs
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=${JWT_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - QINIU_ACCESS_KEY=${QINIU_ACCESS_KEY}
      - QINIU_SECRET_KEY=${QINIU_SECRET_KEY}
      - QINIU_BUCKET=${QINIU_BUCKET}
      - QINIU_ENDPOINT=${QINIU_ENDPOINT}
      - CORS_ORIGIN=${CORS_ORIGIN}
      - APP_URL=${APP_URL:-http://localhost}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost}
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_REDIRECT_URI=${GITHUB_REDIRECT_URI}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - WECHAT_CLIENT_ID=${WECHAT_CLIENT_ID}
      - WECHAT_CLIENT_SECRET=${WECHAT_CLIENT_SECRET}
      - WECHAT_REDIRECT_URI=${WECHAT_REDIRECT_URI}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - csp-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: csp-postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csp-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: csp-redis
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - csp-network
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:

networks:
  csp-network:
    driver: bridge
